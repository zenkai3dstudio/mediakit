<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zenkai3D Studio · Media kit</title>
<meta name="description" content="Pop-culture figures, 3D printed and painted on camera. Audience numbers, best reels and brands, updated every week.">
<meta property="og:title" content="Zenkai3D Studio · Media kit">
<meta property="og:description" content="Pop-culture figures, 3D printed and painted on camera. Audience numbers, best reels and brands, updated every week.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#F2F2F0">
<link rel="icon" href="icona.jpg">
<link rel="apple-touch-icon" href="icona.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F2F0; --surface:#FFFFFF; --ink:#191A1C; --ink-soft:#6B6D72;
  --line:#D9D9D5; --line-strong:#B6B6B1; --good:#3F7D4C;
  --r:3px; --brand-blue:#3E96C2; --brand-orange:#E67324;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#131416; --surface:#1B1C1F; --ink:#EDEDEA; --ink-soft:#95979C;
    --line:#2E3033; --line-strong:#45484C; --good:#6FBF7F;
  }
}
:root[data-theme="dark"]{
  --paper:#131416; --surface:#1B1C1F; --ink:#EDEDEA; --ink-soft:#95979C;
  --line:#2E3033; --line-strong:#45484C; --good:#6FBF7F;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:"Manrope","Avenir Next","Segoe UI Variable",system-ui,sans-serif;
  font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
a{color:inherit}
.wrap{max-width:900px;margin:0 auto;padding:0 20px 70px}

header{padding:34px 0 8px}
.brandbar{display:flex;align-items:center;gap:9px}
.brandmark{width:30px;height:30px;border-radius:7px;display:block;object-fit:cover;flex:none;box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.brandname{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.brandname b{color:var(--brand-blue)}
.brandname i{color:var(--brand-orange);font-style:normal}
.upd{margin-left:auto;font-size:12px;color:var(--ink-soft);white-space:nowrap}
h1{font-size:clamp(30px,6.4vw,52px);font-weight:800;letter-spacing:-.032em;line-height:1;margin:38px 0 0;max-width:15ch}
h1 em{font-style:normal;color:var(--brand-orange)}
.lede{font-size:clamp(15.5px,2.2vw,18px);color:var(--ink-soft);max-width:52ch;margin:16px 0 0}
.cta{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0 0}
.btn{display:inline-flex;align-items:center;gap:7px;text-decoration:none;border:1px solid var(--line-strong);
  background:var(--surface);border-radius:var(--r);padding:9px 14px;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.primary:hover{opacity:.86}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

section{padding-top:46px}
h2{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 14px;
  display:flex;align-items:center;gap:10px}
h2::after{content:"";flex:1;height:1px;background:var(--line)}

.big{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.big .stat:first-child{grid-column:span 1}
.stat{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:14px 14px 13px;min-width:0}
.stat span{display:block;font-size:12px;color:var(--ink-soft);line-height:1.3}
.stat b{display:block;font-size:clamp(24px,4.6vw,34px);font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:6px 0 4px}
.stat small{display:block;font-size:12px;color:var(--ink-soft);line-height:1.35}
.stat.ig b{color:var(--brand-orange)}
.stat.tt b,.stat.yt b{color:var(--brand-blue)}
@media(max-width:620px){.big{grid-template-columns:1fr 1fr}}
.foot{font-size:12.5px;color:var(--ink-soft);margin:10px 0 0;max-width:70ch}

.reels{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:8px;counter-reset:r}
@media(max-width:620px){.reels{grid-template-columns:1fr}}
.reels a{display:flex;gap:12px;align-items:baseline;text-decoration:none;border:1px solid var(--line);border-radius:var(--r);
  background:var(--surface);padding:13px 14px;height:100%}
.reels a:hover{border-color:var(--ink)}
.reels a::before{counter-increment:r;content:counter(r);font-weight:800;color:var(--brand-orange);font-size:15px;min-width:1ch}
.reels .t{flex:1;min-width:0}
.reels .t p{margin:0;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.reels .t small{display:block;color:var(--ink-soft);font-size:12.5px;margin-top:3px}
.reels .v{display:flex;flex-direction:column;align-items:flex-end;text-align:right;white-space:nowrap}
.reels .v b{font-weight:800}
.reels .v small{font-size:11.5px;color:var(--ink-soft);font-weight:500;margin-top:1px}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
.chips li{border:1px solid var(--line-strong);background:var(--surface);border-radius:20px;padding:5px 12px;font-size:13.5px;font-weight:600}
.prizes{margin:14px 0 0;font-size:14px}
.prizes b{color:var(--brand-orange)}

.offer{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:620px){.offer{grid-template-columns:1fr}}
.offer div{border:1px solid var(--line);border-left:3px solid var(--brand-blue);border-radius:var(--r);background:var(--surface);padding:14px 15px}
.offer h3{margin:0 0 4px;font-size:15px;font-weight:700;letter-spacing:-.01em}
.offer p{margin:0;color:var(--ink-soft);font-size:14px}

.contact{border:1px solid var(--ink);border-radius:var(--r);background:var(--surface);padding:22px 20px}
.contact p{margin:0 0 14px;font-size:clamp(17px,2.6vw,21px);font-weight:700;letter-spacing:-.02em;max-width:34ch;line-height:1.25}
.contact .mail{font-size:clamp(15px,2.4vw,18px)}

.state{border:1px dashed var(--line-strong);border-radius:var(--r);padding:14px;color:var(--ink-soft);font-size:14px}
footer{margin-top:40px;font-size:12px;color:var(--ink-soft)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.lang{margin-left:auto;display:inline-flex;border:1px solid var(--line-strong);border-radius:20px;overflow:hidden;background:var(--surface);flex:none}
.lang button[lang="zh-Hans"]{letter-spacing:0;font-size:13px;min-width:42px}
@media(max-width:560px){
  .brandbar{flex-wrap:wrap}
  .lang{margin-left:0;order:3;width:100%;justify-content:space-between;margin-top:10px}
  .lang button{flex:1;min-width:0;padding:7px 4px}}
.lang button{font:inherit;font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--ink-soft);background:none;border:0;
  padding:5px 10px;cursor:pointer;min-width:38px}
.lang button+button{border-left:1px solid var(--line)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.lang button:hover{color:var(--ink)}
.lang button[aria-pressed="true"]:hover{color:var(--paper)}
.lang button:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}


.aff{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.affc{border:1px solid var(--line);border-left:3px solid var(--brand-orange);border-radius:var(--r);background:var(--surface);
  padding:14px 15px;display:flex;flex-direction:column;gap:10px;min-width:0}
.affc .top{display:flex;align-items:baseline;gap:10px}
.affc .top b{font-size:16px;font-weight:700;letter-spacing:-.01em}
.affc .pct{margin-left:auto;font-weight:800;font-size:20px;letter-spacing:-.02em;color:var(--brand-orange);white-space:nowrap}
.affc p{margin:0;color:var(--ink-soft);font-size:14px}
.affc .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.prof{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.prof a{display:flex;align-items:center;gap:12px;text-decoration:none;border:1px solid var(--line);border-left:3px solid var(--brand-blue);
  border-radius:var(--r);background:var(--surface);padding:13px 15px}
.prof a:hover{border-color:var(--ink);border-left-color:var(--brand-blue)}
.prof .n{flex:1;min-width:0}
.prof .n b{display:block;font-size:16px;font-weight:700;letter-spacing:-.01em}
.prof .n small{display:block;color:var(--ink-soft);font-size:13px;margin-top:2px}
.prof .go{font-size:13px;font-weight:600;white-space:nowrap;color:var(--ink-soft)}
/* el primer perfil és el que ha de llegir primer una marca; els altres, a sota i més petits */
.prof a.destacat{grid-column:1/-1;padding:16px 18px;border-left-width:4px;align-items:flex-start}
.prof a.destacat .n b{font-size:19px}
.prof a.destacat .n small{font-size:14px;margin-top:4px;color:var(--ink);max-width:62ch}
.prof a.menor{border-left-color:var(--line-strong);padding:10px 13px}
.prof a.menor .n b{font-size:14.5px;font-weight:600}
.prof a.menor .n small{font-size:12.5px}
.prof a.menor .go{font-size:12px}
/* les peces: la foto mana, i a sota on te la pots baixar */
.peces{margin:0 0 18px}
.colgrup+.colgrup{margin-top:22px}
.colgrup>h3{margin:0 0 3px;font-size:14px;letter-spacing:.01em}
.colgrup>.nota{margin:0 0 11px;color:var(--ink-soft);font-size:13px;max-width:62ch}
.graella{display:grid;grid-template-columns:1fr;gap:7px}
.peca{display:flex;align-items:center;gap:13px;border:1px solid var(--line);border-left:3px solid var(--brand-orange);background:var(--surface);padding:9px 14px 9px 11px}
.peca img{width:56px;height:auto;flex:none;display:block;background:var(--paper)}
/* mentre no hi hagi foto, un marc de la mateixa mida: la fila no es desquadra */
.peca .capfoto{width:56px;height:84px;flex:none;border:1px dashed var(--line-strong);background:var(--paper)}
.peca .d{flex:1;min-width:0}
.peca .d b{display:block;font-size:15px;line-height:1.2;letter-spacing:-.015em}
.peca .on{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.peca .on a{font-size:11px;font-weight:600;text-decoration:none;color:var(--ink-soft);border:1px solid var(--line-strong);border-radius:20px;padding:3px 8px;white-space:nowrap}
.peca .on a:hover{color:var(--ink);border-color:var(--ink);background:var(--paper)}
/* al mòbil estret, la miniatura cedeix l'espai perquè els enllaços no es parteixin */
@media(max-width:380px){
  .peca{gap:10px;padding:8px 10px 8px 9px}
  .peca img,.peca .capfoto{width:44px}
  .peca .capfoto{height:66px}
  .peca .on{gap:4px}
  .peca .on a{padding:3px 6px}}
.code{display:inline-flex;align-items:center;gap:8px;font:inherit;cursor:pointer;border:1px dashed var(--line-strong);
  background:var(--paper);color:var(--ink);border-radius:var(--r);padding:7px 10px;min-width:0}
.code b{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;letter-spacing:.04em;overflow-wrap:anywhere}
.code span{font-size:12px;color:var(--ink-soft);white-space:nowrap}
.code:hover{border-color:var(--ink)}
.code:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.affc .btn{padding:7px 12px;font-size:13.5px}
.pub{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
@media(max-width:620px){.pub{grid-template-columns:1fr}}
.pub>div{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:13px 14px}
.pub h3{margin:0 0 9px;font-size:12px;font-weight:600;color:var(--ink-soft)}
.pub ol{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.pub li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:baseline;font-size:14px}
.pub li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pub li b{font-weight:700;font-variant-numeric:tabular-nums}
.pub li i{grid-column:1/-1;display:block;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.pub li i::before{content:"";display:block;height:100%;width:var(--w);background:var(--brand-orange)}

.cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.cases a{display:flex;flex-direction:column;gap:3px;text-decoration:none;border:1px solid var(--line);border-top:3px solid var(--brand-orange);
  border-radius:var(--r);background:var(--surface);padding:12px 14px 13px}
.cases a:hover{border-color:var(--ink);border-top-color:var(--brand-orange)}
.cases .m{font-size:13px;font-weight:700;letter-spacing:.01em;color:var(--brand-orange)}
.cases .t{font-weight:600;line-height:1.3}
.cases .s{font-size:12.5px;color:var(--ink-soft)}
.cases .v{margin-top:8px;font-size:clamp(22px,4vw,28px);font-weight:800;letter-spacing:-.03em;line-height:1}
.cases .v small{display:block;font-size:12px;font-weight:500;letter-spacing:0;color:var(--ink-soft);margin-top:4px}

/* ---------- Estil «link in bio»: columna centrada, quadrícula suau, píndoles i títols en monoespai.
   Mateixos colors de sempre (paper, ink, taronja i blau de marca). ---------- */
:root{--r:16px;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--grid:rgba(25,26,28,.055);--glow:rgba(230,115,36,.10)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--grid:rgba(255,255,255,.045);--glow:rgba(230,115,36,.13)}}
:root[data-theme="dark"]{--grid:rgba(255,255,255,.045);--glow:rgba(230,115,36,.13)}
body{min-height:100vh;
  background-color:var(--paper);
  background-image:radial-gradient(760px 460px at 50% 0,var(--glow),transparent 72%),
    linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:auto,42px 42px,42px 42px;background-position:0 0,center top,center top}
.wrap{max-width:720px;padding:0 18px 64px}

header{position:relative;padding:58px 0 4px;text-align:center}
.brandbar{flex-direction:column;justify-content:center;gap:12px}
.brandmark{width:88px;height:88px;border-radius:50%;box-shadow:0 0 0 1px var(--line-strong),0 0 0 6px var(--paper),0 0 0 7px var(--line),0 14px 34px -10px var(--glow)}
.brandname{font-size:22px;font-weight:800;letter-spacing:-.02em;text-transform:none}
.lang{position:absolute;top:14px;right:0;margin:0;order:0;border-radius:999px;background:transparent}
@media(max-width:560px){
  .lang{position:static;order:-1;width:auto;margin:0 auto 18px;justify-content:center}
  .lang button{flex:none;padding:6px 10px}
  header{padding-top:22px}}
h1{font-size:clamp(23px,5.4vw,34px);letter-spacing:-.03em;line-height:1.08;margin:18px auto 0;max-width:20ch}
.lede{margin:12px auto 0;font-size:clamp(14.5px,2vw,16px);max-width:46ch}
.cta{justify-content:center;margin:20px 0 0}
.btn{border-radius:999px;padding:8px 16px;font-size:13.5px;background:color-mix(in srgb,var(--surface) 70%,transparent);border-color:var(--line-strong)}
.btn.primary{background:var(--brand-orange);border-color:var(--brand-orange);color:#fff}
.btn.primary:hover{opacity:1;filter:brightness(1.07)}

.jump{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:22px 0 0}
.jump a{font-size:13px;font-weight:600;text-decoration:none;padding:6px 14px;border-radius:999px;
  border:1px solid var(--line-strong);background:color-mix(in srgb,var(--surface) 55%,transparent);color:var(--ink);transition:border-color .15s,transform .15s}
.jump a:hover{border-color:var(--ink);transform:translateY(-1px)}

section{padding-top:40px;scroll-margin-top:14px}
h2{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.16em;color:var(--ink);margin:0 0 14px}
h2::after{background:var(--line-strong)}
h2::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--brand-orange);flex:none}

.stat,.reels a,.offer div,.contact,.pub>div,.cases a,.affc,.prof a,.peca,.state{
  border-radius:var(--r);background:color-mix(in srgb,var(--surface) 82%,transparent);
  border:1px solid var(--line);box-shadow:0 1px 0 rgba(255,255,255,.04) inset}
.offer div,.affc,.prof a,.peca{border-left:1px solid var(--line)}
.prof a:hover,.reels a:hover,.cases a:hover,.stat:hover,.peca:hover{border-color:var(--line-strong)}
.cases a{border-top:1px solid var(--line)}
.cases a:hover{border-top-color:var(--line-strong)}
.prof a.menor{border-left-color:var(--line)}
.prof a.destacat{border-left-width:1px;border-color:var(--brand-blue)}
.contact{border-color:var(--ink)}
.chips li{border-radius:999px;background:color-mix(in srgb,var(--surface) 70%,transparent)}
.code{border-radius:12px}
.affc .btn{border-radius:999px}
.reels a::before{font-family:var(--mono);font-size:13px}
.pub li i{height:5px;border-radius:3px}

/* les figures: foto arrodonida i més grossa, com una icona d'app */
.peca{padding:12px 14px 12px 12px;gap:15px}
.peca img{width:84px;border-radius:16px;box-shadow:0 0 0 1px var(--line)}
.peca .capfoto{width:84px;height:125px;border-radius:16px}
.peca .d b{font-size:16px}
.peca .on a{font-size:11.5px;padding:4px 10px}
@media(max-width:380px){.peca img,.peca .capfoto{width:64px}.peca .capfoto{height:95px}}

footer{text-align:center;font-family:var(--mono);font-size:11px;letter-spacing:.04em;margin-top:46px}

@media(prefers-reduced-motion:no-preference){
  header>*,section{animation:puja .55s cubic-bezier(.2,.7,.2,1) both}
  section:nth-of-type(2){animation-delay:.05s}section:nth-of-type(3){animation-delay:.1s}section:nth-of-type(4){animation-delay:.15s}
  @keyframes puja{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}}

/* codis de descompte: entren desenfocats i escalonats quan s'arriba a la secció, i s'aixequen en passar-hi */
.affc{transition:transform .25s cubic-bezier(.2,.7,.2,1),border-color .2s,box-shadow .25s}
.affc:not(.in){opacity:0}
.affc.in{animation:revela .75s cubic-bezier(.2,.7,.2,1) backwards;animation-delay:calc(var(--i,0)*110ms)}
.affc.in:hover{transform:translateY(-4px);border-color:var(--brand-orange);box-shadow:0 18px 36px -20px var(--glow),0 0 0 1px var(--brand-orange)}
.affc .pct{transition:transform .25s}
.affc.in:hover .pct{transform:scale(1.12)}
.code{transition:transform .15s,border-color .2s,background .2s}
.code:active{transform:scale(.96)}
@keyframes revela{from{opacity:0;filter:blur(12px);transform:translateY(18px) scale(.95)}to{opacity:1;filter:blur(0);transform:none}}
@media(prefers-reduced-motion:reduce){.affc:not(.in){opacity:1}.affc.in{animation:none}.affc.in:hover{transform:none}}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="brandbar">
    <img class="brandmark" src="icona.jpg" alt="">
    <span class="brandname"><b>ZENKAI</b><i>3D STUDIO</i></span>
    <div class="lang" id="lang" role="group" aria-label="Language">
      <button type="button" data-l="en" lang="en" title="English">EN</button>
      <button type="button" data-l="es" lang="es" title="Español">ES</button>
      <button type="button" data-l="ca" lang="ca" title="Català">CA</button>
      <button type="button" data-l="de" lang="de" title="Deutsch">DE</button>
      <button type="button" data-l="pt" lang="pt" title="Português">PT</button>
      <button type="button" data-l="zh" lang="zh-Hans" title="中文">中文</button>
    </div>
  </div>
  <h1 data-h="h1"></h1>
  <p class="lede" data-t="lede"></p>
  <div class="cta">
    <a class="btn primary js-mail" href="mailto:zenkai3dstudio@gmail.com" data-t="cta"></a>
    <a class="btn" href="https://www.instagram.com/zenkai3d_studio/" target="_blank" rel="noopener">Instagram</a>
    <a class="btn" href="https://www.tiktok.com/@zenkai3d_studio" target="_blank" rel="noopener">TikTok</a>
    <a class="btn" href="https://www.youtube.com/@zenkai3dstudio" target="_blank" rel="noopener">YouTube</a>
  </div>
</header>

<nav class="jump" id="jump" aria-label="Sections" hidden></nav>

<p class="state" id="state" hidden></p>

<section id="s-num" hidden>
  <h2 data-t="audience"></h2>
  <div class="big" id="stats"></div>

  $("state").textContent = t("state");
}

function pinta() {
  if (!D) return;
  var ig = D.instagram || {}, tk = D.tiktok || {}, yt = D.youtube || {};
  $("upd").textContent = D.actualitzat ? t("upd", { d: dia(D.actualitzat) }) : "";

  var h = "";
  h += stat("ig", t("igF"), num(ig.seguidors), ig.usuari ? "@" + ig.usuari : "");
  h += stat("ig", t("views12"), compact(ig.vistes_12m), ig.reels_12m ? t("reelsN", { n: ig.reels_12m }) : "");
  h += stat("ig", t("medV"), num(ig.mediana_vistes), ig.mediana_abast ? t("medR", { n: num(ig.mediana_abast) }) : "");
  h += stat("ig", t("eng"), ig.interaccio_pct != null ? nf().format(ig.interaccio_pct) + (L === "en" ? "%" : " %") : null, t("engS"));
  h += stat("ig", t("shares"), ig.compartits_mitjana != null ? nf().format(ig.compartits_mitjana) : null, t("avg"));
  h += stat("tt", t("ttF"), num(tk.seguidors), tk.mediana_vistes ? t("ttMed", { n: num(tk.mediana_vistes) }) : "");
  if (yt.subscriptors) {
    h += stat("yt", yt.subscriptors ? t("ytS") : t("ytSh"), num(yt.subscriptors || yt.shorts),
      yt.subscriptors && yt.shorts ? t("shortsN", { n: yt.shorts }) : "");
  }
  $("stats").innerHTML = h;
  $("s-num").hidden = !h;

  var top = D.top || [];
  $("top").innerHTML = top.map(function (r) {
    return '<li><a href="' + esc(r.url) + '" target="_blank" rel="noopener"><span class="t"><p>' + esc(r.titol) + '</p><small>' + esc(dia(r.data)) + '</small></span>' +
      '<span class="v"><b>' + esc(num(r.vistes)) + '</b><small>' + esc(t("viewsW")) + '</small></span></a></li>';
  }).join("");
  $("s-top").hidden = !top.length;

  var P = D.public || {}, pc = (L === "en" ? "%" : " %");
  var noms = null;
  try { noms = new Intl.DisplayNames([LOC[L]], { type: "region" }); } catch (e) {}
  function barres(llista, nom) {
    var max = llista.length ? llista[0][1] : 1;
    return llista.map(function (x) {
      return '<li><span>' + esc(nom(x[0])) + '</span><b>' + esc(x[1] + pc) + '</b><i style="--w:' + Math.round(x[1] * 100 / max) + '%"></i></li>';
    }).join("");
  }
  var ps = (P.paisos || []).slice(0, 5), ed = (P.edats || []).filter(function (x) { return x[1] >= 1; }).slice(0, 4);
  $("paisos").innerHTML = barres(ps, function (c) { try { return (noms && noms.of(c)) || c; } catch (e) { return c; } });
  $("edats").innerHTML = barres(ed, function (a) { return String(a).replace("-", "–"); });
  $("pub").hidden = !ps.length && !ed.length;

  var cs = ((C && C.colaboracions) || []).filter(function (c) { return c && c.codi; });
  var vs = D.vistes || {};
  $("cases").innerHTML = cs.map(function (c) {
    var tit = (c.titol && typeof c.titol === "object") ? (c.titol[L] || c.titol.en) : c.titol;
    var v = vs[c.codi];
    return '<a href="https://www.instagram.com/reel/' + encodeURIComponent(c.codi) + '/" target="_blank" rel="noopener">' +
      '<span class="m">' + esc(c.marca) + '</span><span class="t">' + esc(tit || "") + '</span>' +
      (c.material ? '<span class="s">' + esc(c.material) + '</span>' : '') +
      (v ? '<span class="v">' + esc(num(v)) + '<small>' + esc(t("watch")) + '</small></span>' : '') + '</a>';
  }).join("");
  $("s-cases").hidden = !cs.length;

  var br = (C && C.marques) || [];
  $("brands").innerHTML = br.map(function (m) { return "<li>" + esc(m) + "</li>"; }).join("");
  if (D.premis) { $("prizes").innerHTML = t("prizes", { n: esc(D.premis) }); }
  $("prizes").hidden = !D.premis;
  $("s-brands").hidden = !br.length && !D.premis;
}

function curt(x) {
  if (x == null) return null;
  if (L === "en" && x >= 1000) return (x >= 1e4 ? Math.round(x / 1e3) : Math.round(x / 100) / 10) + "K";
  return nf().format(x);
}
function notaColleccio(nom) {
  var cols = (C && C.colleccions) || [];
  for (var i = 0; i < cols.length; i++) {
    if (cols[i] && cols[i].nom === nom) return cols[i].nota ? (cols[i].nota[L] || cols[i].nota.en || "") : "";
  }
  return "";
}
function pintaPeces() {
  var pc = ((C && C.peces) || []).filter(function (p) { return p && p.nom; });
  // agrupades per col·lecció, en l'ordre en què hi surt la primera figura de cada una.
  // Les que no en porten cap van juntes en un grup sense títol.
  var ordre = [], grups = {};
  pc.forEach(function (p) {
    var k = p.colleccio || "";
    if (!grups[k]) { grups[k] = []; ordre.push(k); }
    grups[k].push(p);
  });
  $("peces").innerHTML = ordre.map(function (k) {
    var nota = k ? notaColleccio(k) : "";
    return '<div class="colgrup">' +
      (k ? '<h3>' + esc(k) + '</h3>' : "") +
      (nota ? '<p class="nota">' + esc(nota) + '</p>' : "") +
      '<div class="graella">' + grups[k].map(function (p) {
        var on = (p.enllacos || []).filter(function (e) { return e && e.on && e.url; });
        return '<div class="peca">' +
          (p.foto ? '<img src="' + esc(p.foto) + '" alt="' + esc(p.nom) + '" loading="lazy">'
                  : '<div class="capfoto" aria-hidden="true"></div>') +
          '<div class="d"><b>' + esc(p.nom) + '</b>' +
          (p.nota ? '<p class="nota" style="margin:4px 0 0;font-size:12px;line-height:1.4">' + esc(p.nota[L] || p.nota.en || "") + '</p>' : "") +
          (on.length ? '<div class="on">' + on.map(function (e) {
            return '<a href="' + esc(e.url) + '" target="_blank" rel="noopener">' + esc(e.on) + '</a>';
          }).join("") + '</div>' : "") +
          "</div></div>";
      }).join("") + '</div></div>';
  }).join("");
  return pc.length;
}
function pintaPerfils() {
  var pf = ((C && C.perfils) || []).filter(function (p) { return p && p.nom && p.url; });
  // fora del && : amb perfils a la llista, el curtcircuit no arribaria mai a pintar les peces
  var np = pintaPeces();
  $("s-prof").hidden = !pf.length && !np;
  $("prof").innerHTML = pf.map(function (p, i) {
    var dades = [];
    if (p.models) dades.push(t("nModels", { n: curt(p.models) }));
    if (p.seguidors) dades.push(t("nFollowers", { n: curt(p.seguidors) }));
    if (p.m_agrada) dades.push(t("nLikes", { n: curt(p.m_agrada) }));
    var nota = p.nota ? (p.nota[L] || p.nota.en || "") : "";
    var sota = dades.join(" · ");
    if (nota) sota = sota ? nota + " · " + sota : nota;
    return '<a class="' + (i ? "menor" : "destacat") + '" href="' + esc(p.url) + '" target="_blank" rel="noopener">' +
      '<span class="n"><b>' + esc(p.nom) + '</b>' +
      (sota ? '<small>' + esc(sota) + '</small>' : '') + '</span>' +
      '<span class="go">' + esc(t("profile")) + ' ↗</span></a>';
  }).join("");
}
function revelaAff() {
  var els = $("aff").querySelectorAll(".affc");
  var tot = function () { Array.prototype.forEach.call(els, function (e) { e.classList.add("in"); }); };
  if (!("IntersectionObserver" in window)) { tot(); return; }
  var io = new IntersectionObserver(function (en) {
    en.forEach(function (x) { if (x.isIntersecting) { x.target.classList.add("in"); io.unobserve(x.target); } });
  }, { threshold: .15 });
  Array.prototype.forEach.call(els, function (e, i) { e.style.setProperty("--i", i); io.observe(e); });
  setTimeout(tot, 5000);
}
function pintaAfiliats() {
  var af = ((C && C.afiliats) || []).filter(function (a) { return a && a.marca && a.url; });
  $("s-aff").hidden = !af.length;
  $("aff").innerHTML = af.map(function (a, i) {
    var desc = a.pct ? t("off")(a.pct, !!a.primera) : "";
    var nota = a.nota ? (a.nota[L] || a.nota.en || "") : "";
    return '<div class="affc"><div class="top"><b>' + esc(a.marca) + '</b>' +
      (a.pct ? '<span class="pct">−' + esc(a.pct) + (L === "en" ? "%" : " %") + '</span>' : '') + '</div>' +
      ((desc || nota) ? '<p>' + esc([desc, nota].filter(Boolean).join(". ")) + '</p>' : '') +
      '<div class="acts">' +
      (a.codi ? '<button type="button" class="code" data-i="' + i + '"><b>' + esc(a.codi) + '</b><span>' + esc(t("copy")) + '</span></button>' : '') +
      '<a class="btn primary" href="' + esc(a.url) + '" target="_blank" rel="noopener sponsored">' + esc(t("shop")) + ' ↗</a>' +
      '</div></div>';
  }).join("");
  revelaAff();
  Array.prototype.forEach.call($("aff").querySelectorAll(".code"), function (b) {
    b.onclick = function () {
      var codi = af[+b.dataset.i].codi, sp = b.querySelector("span");
      var fet = function () { sp.textContent = t("copied"); setTimeout(function () { sp.textContent = t("copy"); }, 1600); };
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(codi).then(fet, function () { copiaVell(codi); fet(); }); }
        else { copiaVell(codi); fet(); }
      } catch (e) { copiaVell(codi); fet(); }
    };
  });
}
function copiaVell(s) {
  try {
    var ta = document.createElement("textarea"); ta.value = s; ta.setAttribute("readonly", "");
    ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select();
    document.execCommand("copy"); document.body.removeChild(ta);
  } catch (e) {}
}


/* Salts ràpids: una píndola per cada secció que es veu, amb el títol que té. */
function pintaNav() {
  var nav = $("jump"); if (!nav) return;
  var h = [];
  Array.prototype.forEach.call(document.querySelectorAll("section[id]"), function (sec) {
    if (sec.hidden) return;
    var t2 = sec.querySelector("h2"); if (!t2 || !t2.textContent.trim()) return;
    h.push('<a href="#' + sec.id + '">' + esc(t2.textContent.replace(/,.*$/, "")) + '</a>');
  });
  nav.innerHTML = h.join(""); nav.hidden = !h.length;
}
function canvia(l) {
  if (LANGS.indexOf(l) < 0) return;
  L = l; lsSet(KEY, l);
  textos(); pinta(); pintaPerfils(); pintaAfiliats(); pintaNav();
}
Array.prototype.forEach.call($("lang").querySelectorAll("button"), function (b) {
  b.onclick = function () { canvia(b.dataset.l); };
});

L = triaIdioma();
textos();
function json(u) {
  return fetch(u + "?t=" + Date.now(), { cache: "no-store" }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); });
}
/* El comptador de visites. El codi del compte surt de dossier-config.json: mentre
   no n'hi hagi, no es carrega res. GoatCounter no posa galetes ni recull dades
   personals, així que la pàgina no necessita cap avís de cookies. */
function comptador() {
  var c = (C && C.analitica && C.analitica.goatcounter) || "";
  if (!c || !/^[a-z0-9-]{1,40}$/.test(c)) return;
  var s = document.createElement("script");
  s.async = true;
  s.src = "https://gc.zgo.at/count.js";
  s.setAttribute("data-goatcounter", "https://" + c + ".goatcounter.com/count");
  document.head.appendChild(s);
}

json("dossier-config.json").then(function (c) { C = c; }, function () { C = null; }).then(function () {
  comptador();
  pintaPerfils(); pintaAfiliats();
  return json("dossier.json").then(function (d) {
    D = d;
    pinta(); pintaNav();
  });
}).catch(function () { $("state").hidden = false; });
</script>
